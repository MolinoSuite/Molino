# Molino se publica en la Microsoft Store (sin instalador .exe): el paquete de
# Molino PDF sale de aquí (npm run dist:store) y el de Molino Suite, con todas
# las apps, de scripts/make-suite-msix.mjs (npm run dist:suite).
appId: org.molinosuite.molino
productName: Molino PDF
# El programa lleva el nombre de la suite: en Molino Suite, el mismo Molino.exe
# abre todas las apps. Sin espacio: los scripts no necesitan comillas.
executableName: Molino
copyright: Copyright © 2026 CuevasTech · AGPL-3.0-or-later

directories:
  output: dist
  buildResources: build

# Solo se empaqueta el código compilado; las dependencias de desarrollo no viajan.
files:
  - out/**/*
  - package.json

asar: true

# Licencias de los componentes de terceros (scripts/third_party_notices.py), junto a Molino.exe.
extraFiles:
  - from: build/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  # La licencia de Molino PDF (la muestra «Acerca de Molino PDF»).
  - from: LICENSE
    to: LICENSE.txt

extraResources:
  - from: dist-engine/molino-engine
    to: engine
  # Lo de Documentos, Hojas y Presentaciones (iconos de sus ventanas, plantillas y el
  # motor de oficina) solo va en el paquete de Molino Suite: lo añade
  # scripts/make-suite-msix.mjs. El de Molino PDF es solo el PDF.
  - from: resources/tessdata
    to: assets/tessdata
    filter:
      - "*.traineddata"

win:
  target:
    - target: appx
      arch: [x64]
  icon: build/icon.ico
  fileAssociations:
    # En el paquete de la Store, «Abrir con» y «Aplicaciones predeterminadas» de los PDF.
    - ext: pdf
      name: Molino.PDF
      description: PDF
      role: Editor

# Versión de la Microsoft Store (MSIX): npm run dist:store (o, con la app ya
# compilada, electron-builder --win appx --prepackaged dist\win-unpacked). La
# Store firma el paquete al publicarlo. Los datos de la app van en la carpeta del
# paquete y las versiones nuevas llegan por la Store (src/main/appx.ts, updates.ts).
appx:
  # La identidad del producto en Partner Center (Producto → Administración del
  # producto → Identidad del producto): tiene que coincidir tal cual, o la
  # Store rechaza el paquete.
  identityName: CuevasTech.MolinoPDF
  publisher: CN=7B14860F-70FA-44EA-98D2-54F99AD6920A
  publisherDisplayName: Cuevas Tech
  applicationId: MolinoPDF
  displayName: Molino PDF
  backgroundColor: transparent
  languages: [es-ES, en-US]
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  artifactName: MolinoPDF.${ext}
  # Imágenes en build/appx (scripts/make-appx-assets.py); el manifiesto lleva
  # además el alias «molino-pdf» para abrir PDF desde la línea de órdenes.
  customManifestPath: appx-manifest/AppxManifest.xml
  customExtensionsPath: build/appx-manifest/extensions.xml

# Endurecimiento del binario de Electron (OWASP A02:2025 / A08:2025): no puede
# usarse como intérprete de Node ni depurarse por línea de órdenes, y solo
# carga el código de la aplicación desde su archivo asar verificado.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
