# Identificador de la suite, no solo de esta app: cuando lleguen Documentos,
# Hojas y Presentaciones irán en esta misma instalación, que se actualizará
# sola, sin cambiar de identidad.
appId: org.molinosuite.molino
productName: Molino PDF
# El programa y su carpeta llevan el nombre de la suite (Molino.exe en
# %LOCALAPPDATA%\Programs\Molino): Documentos, Hojas y Presentaciones se añaden
# a esta misma instalación (..\PLAN-SUITE.md). Lo que se ve (accesos, «Aplicaciones
# instaladas») sigue diciendo Molino PDF mientras sea la única app. Sin espacio:
# los scripts no necesitan comillas.
executableName: Molino
copyright: Copyright © 2026 CuevasTech · AGPL-3.0-or-later

directories:
  output: dist
  buildResources: build

# Solo se empaqueta el código compilado; las dependencias de desarrollo no viajan.
files:
  - out/**/*
  - package.json

asar: true

# Licencias de los componentes de terceros (scripts/third_party_notices.py), junto a Molino.exe.
extraFiles:
  - from: build/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  # La licencia de Molino PDF (la muestra «Acerca de Molino PDF»).
  - from: LICENSE
    to: LICENSE.txt

# Versiones nuevas: se publican en GitHub Releases y la aplicación las
# encuentra ahí (src/main/updates.ts). Con esto electron-builder
# genera latest.yml junto al instalador y app-update.yml dentro de la aplicación.
# Cuando el instalador vaya firmado, añadir en win.signtoolOptions el
# publisherName: la aplicación exigirá entonces que las versiones nuevas
# vengan firmadas por el mismo editor.
# El repositorio es el de la suite (github.com/MolinoSuite/Molino).
publish:
  provider: github
  owner: MolinoSuite
  repo: Molino
  releaseType: release

extraResources:
  - from: dist-engine/molino-engine
    to: engine
  # Iconos de Documentos, Hojas y Presentaciones (y de la suite): sus accesos en el
  # menu Inicio, sus ventanas y sus tipos de archivo apuntan a ellos (src/main/shellapps.ts).
  - from: build/icons
    to: icons
    filter:
      - "*.ico"
  # Plantillas para empezar de Documentos, Hojas y Presentaciones (src/main/officewin.ts).
  - from: resources/templates
    to: templates
    filter:
      - "**/*.docx"
      - "**/*.xlsx"
      - "**/*.pptx"
  - from: resources/tessdata
    to: assets/tessdata
    filter:
      - "*.traineddata"

win:
  # Firma del instalador. Con el certificado de firma de código conectado,
  # descomentar y poner su huella y su nombre exacto:
  # signtoolOptions:
  #   certificateSha1: HUELLA_DEL_CERTIFICADO
  #   rfc3161TimeStampServer: http://time.certum.pl
  #   signingHashAlgorithms: [sha256]
  #   publisherName: NOMBRE_EXACTO_DEL_CERTIFICADO
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  fileAssociations:
    # name es el identificador del tipo de archivo (ProgId) en el registro: propio
    # de Molino PDF, para no confundirse con el de otro programa. Lo que ve el usuario
    # es description. build/installer.nsh registra ademas a Molino PDF como aplicacion
    # con capacidades, para poder elegirlo como programa predeterminado.
    - ext: pdf
      name: Molino.PDF
      description: PDF
      role: Editor

nsis:
  # Sin espacios: GitHub cambia los espacios de los archivos subidos y el nombre
  # dejaria de coincidir con el que anuncia latest.yml. Sin numero de version:
  # asi la web enlaza siempre a la ultima con una direccion fija
  # (releases/latest/download/MolinoPDF-Setup.exe); cada version sigue teniendo la
  # suya propia (releases/download/vX.Y.Z/MolinoPDF-Setup.exe).
  artifactName: MolinoPDF-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Molino PDF
  uninstallDisplayName: Molino PDF
  # Instalador en inglés y español: elige solo el idioma de Windows (si no es
  # ninguno de los dos, inglés).
  installerLanguages: [en_US, es_ES]
  multiLanguageInstaller: true
  displayLanguageSelector: false
  language: "1033"
  include: build/installer.nsh

# Versión de la Microsoft Store (MSIX): npm run dist:store (o, con la app ya
# compilada, electron-builder --win appx --prepackaged dist\win-unpacked). La
# Store firma el paquete al publicarlo. Los datos de la app van en la carpeta del
# paquete y las versiones nuevas llegan por la Store (src/main/appx.ts).
appx:
  # La identidad del producto en Partner Center (Producto → Administración del
  # producto → Identidad del producto): tiene que coincidir tal cual, o la
  # Store rechaza el paquete.
  identityName: CuevasTech.MolinoPDF
  publisher: CN=7B14860F-70FA-44EA-98D2-54F99AD6920A
  publisherDisplayName: Cuevas Tech
  applicationId: MolinoPDF
  displayName: Molino PDF
  backgroundColor: transparent
  languages: [es-ES, en-US]
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  artifactName: MolinoPDF.${ext}
  # Imágenes en build/appx (scripts/make-appx-assets.py); el manifiesto lleva
  # además el alias «molino-pdf» para abrir PDF desde la línea de órdenes.
  customManifestPath: appx-manifest/AppxManifest.xml
  customExtensionsPath: build/appx-manifest/extensions.xml

# Endurecimiento del binario de Electron (OWASP A02:2025 / A08:2025): no puede
# usarse como intérprete de Node ni depurarse por línea de órdenes, y solo
# carga el código de la aplicación desde su archivo asar verificado.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
